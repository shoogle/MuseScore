name: "Translate1: lupdate new strings PR"

on:
  workflow_dispatch:
  schedule:
    # Comment out the appropriate cron line to disable the scheduled workflow on that branch.
    - cron: "0 12 * * Sun" # main branch
    - cron: "0 13 * * Sun" # release branch

env:
  # Identify the current release branch for the scheduled workflow.
  BRANCH: ${{ github.event.schedule == '0 13 * * Sun' && '4.7' || github.ref_name }}

jobs:
  lupdate:
    runs-on: ubuntu-slim
    if: github.repository == 'musescore/MuseScore' || github.event_name != 'schedule'
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BRANCH }}
          submodules: recursive

      - name: Configure workflow
        run: |
          sudo apt-get update && sudo apt-get install -y cmake

          VERSION="$(cmake -P version.cmake | tee /dev/stderr | sed -n 's|^-- MUSE_APP_VERSION ||p')"
          int='(0|[1-9][0-9]*)'
          if [[ ! "${VERSION}" =~ ^${int}\.${int}\.${int}$ ]]; then
            echo >&2 "Badly formed app version from version.cmake: ${VERSION}"
            exit 1
          fi
          PATCH_VERSION="${BASH_REMATCH[3]}"

          # Does a remote tag exist for this version? E.g. if VERSION is 5.0.0,
          # TAG can be v5.0.0, v5.0, v5, or empty if it's not yet released.
          repo='origin' # Note: Forked repos often don't have upstream's tags.
          patterns=("v${VERSION}" "v${VERSION%.0}" "v${VERSION%.0.0}")
          TAG="$(git ls-remote --refs --tags "${repo}" "${patterns[@]}")" || {
            echo >&2 "Unable to fetch tags for remote repo: ${repo}"
            exit 1
          }

          LUPDATE_ARGS=''

          if [[ "${PATCH_VERSION}" == 0 && ! "${TAG}" ]]; then
            # This is an unreleased major or minor version. It doesn't share
            # translations on S3 with prior releases, so we can delete strings
            # without affecting in-app language updates in prior versions.
            LUPDATE_ARGS='-no-obsolete' # Reduces workload for translators.
          fi

          echo "VERSION=${VERSION}"
          echo "PATCH_VERSION=${PATCH_VERSION}"
          echo "TAG=${TAG}"
          echo "LUPDATE_ARGS=$LUPDATE_ARGS" | tee -a $GITHUB_ENV

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.2
          host: "linux"
          target: "desktop"
          arch: "linux_gcc_64"
          cache: true

      - name: Run lupdate
        run: |
          bash ./tools/translations/run_lupdate.sh

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit-message: "Run `lupdate` with arguments `${{ env.LUPDATE_ARGS }}`"
          base: ${{ env.BRANCH }}
          branch: "ci_lupdate_${{ env.BRANCH }}"
          add-paths: share/locale/*
          title: "Update in-repo translation source files"
          body: "Run `lupdate` with arguments `${{ env.LUPDATE_ARGS }}`"
          labels: strings
          reviewers: shoogle
